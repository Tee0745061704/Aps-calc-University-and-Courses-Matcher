<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;background: linear-gradient(200deg ,orange 50%,red 70%);">
    <div style="background: linear-gradient(200deg ,yelow 50%,peach 70%);; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px;">
        <h2 style="margin-top: 0; text-align: center; color: #333;">Student Login</h2>
        <form action="/login" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Username:</label>
                <input type="text" name="username" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 10px solid crimson; border-radius: 40px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Password:</label>
                <input type="password" name="password" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 10px solid crimson; border-radius: 40px;">
            </div>
            <button type="submit" style="background: linear-gradient(200deg ,orange 50%,red 70%); color: white; border: none; padding: 12px; border-radius: 40px; width: 100%; cursor: pointer; font-weight: bold;">Sign In</button>
        </form>
        <p style="text-align: center; margin-bottom: 0; font-size: 14px;">New student? <a href="/register">Register profile here</a></p>
    </div>
</body>
</html>
