<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Thembas System</title>
    <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400&display=swap');</style>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#050508; overflow:hidden; perspective:1500px; font-family:'JetBrains Mono', monospace;">
    <div style="position:absolute; inset:0; background: radial-gradient(circle at 80% 20%, rgba(168,85,247,0.15), transparent 40%), radial-gradient(circle at 20% 80%, rgba(0,255,255,0.12), transparent 40%), linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;"></div>

    <div style="position:relative; background: linear-gradient(180deg, rgba(30,30,35,0.9), rgba(15,15,18,0.95)); padding:40px 35px; border-radius:20px; width:100%; max-width:380px; border:1px solid rgba(255,255,255,0.08); box-shadow: 0 0 0 1px rgba(168,85,247,0.12) inset, 0 30px 60px rgba(0,0,0,0.9), 0 0 80px rgba(168,85,247,0.08); transform: rotateX(8deg) rotateY(8deg) translateZ(0); transform-style:preserve-3d; transition: all 0.6s cubic-bezier(0.23,1,0.32,1);" onmouseover="this.style.transform='rotateX(0deg) rotateY(0deg) translateZ(50px)'" onmouseout="this.style.transform='rotateX(8deg) rotateY(8deg) translateZ(0)'">
        <div style="position:absolute; top:-1px; left:20%; right:20%; height:1px; background: linear-gradient(90deg, transparent, #a855f7, transparent); box-shadow: 0 0 10px #a855f7;"></div>

        <div style="text-align:center; margin-bottom:30px; transform: translateZ(30px);">
            <div style="width:60px; height:60px; margin:0 auto 15px; background: linear-gradient(145deg, #222, #111); border-radius:12px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); font-family:'Orbitron', sans-serif; color:#a855f7; font-size:22px; text-shadow:0 0 10px #a855f7;">+</div>
            <h2 style="margin:0; font-family:'Orbitron', sans-serif; color:#fff; letter-spacing:3px; font-size:18px; text-transform:uppercase;">NEW PROFILE</h2>
            <p style="margin:8px 0 0; color:#a855f7; font-size:10px; letter-spacing:4px; opacity:0.7;">REGISTER NODE // SECURE</p>
        </div>
        
        <form action="/register" method="POST" style="transform: translateZ(20px);">
            <div style="margin-bottom:20px;">
                <label style="display:block; margin-bottom:8px; color:#666; font-size:10px; letter-spacing:2px;">> CHOOSE_USERNAME</label>
                <input type="text" name="username" required style="width:100%; padding:14px 16px; box-sizing:border-box; background: rgba(0,0,0,0.6); border:1px solid #222; border-left:2px solid #a855f7; border-radius:4px; color:#fff; font-family:'JetBrains Mono', monospace; outline:none; box-shadow: inset 0 2px 10px rgba(0,0,0,1);">
            </div>
            <div style="margin-bottom:30px;">
                <label style="display:block; margin-bottom:8px; color:#666; font-size:10px; letter-spacing:2px;">> SET_ACCESS_KEY</label>
                <input type="password" name="password" required style="width:100%; padding:14px 16px; box-sizing:border-box; background: rgba(0,0,0,0.6); border:1px solid #222; border-left:2px solid #00ffff; border-radius:4px; color:#fff; font-family:'JetBrains Mono', monospace; outline:none; box-shadow: inset 0 2px 10px rgba(0,0,0,1);">
            </div>
            <button type="submit" style="width:100%; padding:15px; background: linear-gradient(90deg, #a855f7 0%, #00ffff 100%); border:none; border-radius:4px; color:#000; font-family:'Orbitron', sans-serif; font-weight:700; letter-spacing:2px; font-size:13px; cursor:pointer; box-shadow: 0 0 20px rgba(168,85,247,0.3), 0 10px 20px rgba(0,0,0,0.5);">[ CREATE_AND_LAUNCH ]</button>
        </form>
        <p style="text-align:center; margin:25px 0 0; font-size:11px; color:#555;">EXISTING NODE? <a href="/login" style="color:#a855f7; text-decoration:none; border-bottom:1px dashed rgba(168,85,247,0.4);">LOGIN_ID</a></p>
    </div>
</body>
</html>
